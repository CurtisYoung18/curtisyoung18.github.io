<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="author" content="Curtis Mei">
    <meta name="description" content="Development Related Projects">
    <meta name="keywords" content="Web Development, Projects">
    <title>Development Related Projects | Curtis の Home</title>
    <link rel="icon" href="/favicon.ico">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .animated-products-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 4rem 2rem;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: #3498db;
            text-decoration: none;
            margin-bottom: 2rem;
            font-size: 1rem;
            transition: transform 0.3s ease;
        }

        .back-button:hover {
            transform: translateX(-5px);
        }

        .products-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 3rem;
        }

        @media (min-width: 768px) {
            .products-grid {
                grid-template-columns: 1fr 1fr;
                gap: 4rem;
            }
        }

        .products-image-container {
            position: relative;
            height: 400px;
            width: 100%;
        }

        .product-image-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transform: scale(0.9) rotateY(0deg);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1;
        }

        .product-image-wrapper.active {
            opacity: 1;
            transform: scale(1) rotateY(0deg) translateY(0);
            z-index: 10;
        }

        .product-image-wrapper.prev {
            opacity: 0.7;
            transform: scale(0.95) rotateY(-10deg);
            z-index: 2;
        }

        .product-image-wrapper.next {
            opacity: 0.7;
            transform: scale(0.95) rotateY(10deg);
            z-index: 2;
        }

        .product-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .products-content {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 1rem 0;
        }

        .product-info {
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s ease;
        }

        .product-info.active {
            opacity: 1;
            transform: translateY(0);
        }

        .product-name {
            font-size: 2rem;
            font-weight: 700;
            color: #2c3e50;
            margin: 0 0 0.5rem 0;
        }

        .product-category {
            font-size: 0.9rem;
            color: #7f8c8d;
            margin-bottom: 2rem;
        }

        .product-description {
            font-size: 1.1rem;
            color: #34495e;
            line-height: 1.8;
            margin-bottom: 2rem;
        }

        .product-description-word {
            display: inline-block;
            opacity: 0;
            filter: blur(10px);
            transform: translateY(5px);
            transition: all 0.2s ease;
        }

        .product-description-word.visible {
            opacity: 1;
            filter: blur(0);
            transform: translateY(0);
        }

        .product-controls {
            display: flex;
            gap: 1rem;
            padding-top: 2rem;
        }

        .control-button {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #ecf0f1;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #2c3e50;
        }

        .control-button:hover {
            background: #3498db;
            color: white;
            transform: scale(1.1);
        }

        .control-button:active {
            transform: scale(0.95);
        }

        .product-links {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-top: 2rem;
        }

        .product-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            background: rgba(52, 152, 219, 0.1);
            color: #3498db;
            text-decoration: none;
            border-radius: 25px;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .product-link:hover {
            background: rgba(52, 152, 219, 0.2);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(52, 152, 219, 0.3);
        }

        .product-link.github {
            background: rgba(36, 41, 46, 0.1);
            color: #24292e;
        }

        .product-link.github:hover {
            background: rgba(36, 41, 46, 0.15);
        }

        /* Dark mode */
        .dark .product-name {
            color: #ecf0f1;
        }

        .dark .product-category {
            color: #95a5a6;
        }

        .dark .product-description {
            color: #bdc3c7;
        }

        .dark .control-button {
            background: #34495e;
            color: #ecf0f1;
        }

        .dark .control-button:hover {
            background: #3498db;
        }

        @media (max-width: 767px) {
            .products-grid {
                gap: 2rem;
            }

            .products-image-container {
                height: 300px;
            }

            .product-name {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <header>
            <nav class="navbar">
                <div class="container">
                    <div class="navbar-header header-logo"><a href="/">Curtis の Home</a></div>
                    <div class="menu navbar-right">
                        <a class="menu-item" href="/archives">Posts</a>
                        <a class="menu-item" href="/products">Products</a>
                        <a class="menu-item" href="/collection">Collections</a>
                        <a class="menu-item" href="/about">About</a>
                    </div>
                </div>
            </nav>
        </header>

        <div class="main">
            <div class="container">
                <div class="animated-products-container">
                    <a href="/products/" class="back-button">
                        <i class="fas fa-arrow-left"></i> Back to Products
                    </a>

                    <div class="products-grid">
                        <div class="products-image-container" id="imageContainer"></div>
                        <div class="products-content">
                            <div class="product-info" id="productInfo">
                                <h3 class="product-name" id="productName"></h3>
                                <p class="product-category" id="productCategory"></p>
                                <p class="product-description" id="productDescription"></p>
                                <div class="product-links" id="productLinks"></div>
                            </div>
                            <div class="product-controls">
                                <button class="control-button" id="prevButton">
                                    <i class="fas fa-arrow-left"></i>
                                </button>
                                <button class="control-button" id="nextButton">
                                    <i class="fas fa-arrow-right"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <footer id="footer" class="footer">
            <div class="copyright">
                <span>© Curtis Mei | Powered by <a href="https://hexo.io" target="_blank">Hexo</a> & <a href="https://github.com/Siricee/hexo-theme-Chic" target="_blank">Chic</a></span>
            </div>
        </footer>
    </div>

    <script>
        const products = [
            {
                name: "Scan Me",
                category: "Web Application",
                description: "An online QR code generator for restaurants to facilitate contactless payments.",
                image: "/images/products/scan_me.png",
                links: [
                    { url: "https://github.com/CurtisYoung18/Scan_Me", text: "GitHub", icon: "fab fa-github", class: "github" }
                ]
            },
            {
                name: "Community Tournament Commentator Scheduling System",
                category: "Full-Stack Application",
                description: "A commentator scheduling system for community tournaments, which allows users to schedule commentators for their tournaments.",
                image: "/images/products/diwurenge.png",
                links: [
                    { url: "https://github.com/handsomeSpring/commentary_v2", text: "GitHub", icon: "fab fa-github", class: "github" },
                    { url: "https://commentary.idvasg.cn/#/", text: "Demo", icon: "fas fa-external-link-alt" }
                ]
            },
            {
                name: "Portfolio",
                category: "Website",
                description: "A portfolio website for GreenGo, an online information platform for biking enthusiasts.",
                image: "/images/products/portfolio.png",
                links: [
                    { url: "https://github.com/CurtisYoung18/My-Portfolio", text: "GitHub", icon: "fab fa-github", class: "github" }
                ]
            },
            {
                name: "Gowalla Explorer",
                category: "Data Visualization",
                description: "A full-stack web application for exploring and analyzing location-based check-in data from the Gowalla dataset with interactive mapping and trajectory visualization.",
                image: "/images/products/gowalla.png",
                links: [
                    { url: "https://github.com/CurtisYoung18/Gowalla-Explorer", text: "GitHub", icon: "fab fa-github", class: "github" }
                ]
            },
            {
                name: "Mindful Retreat",
                category: "Event Website",
                description: "A modern event website for mindfulness retreats, featuring responsive design and interactive elements.",
                image: "/images/products/event.png",
                links: [
                    { url: "https://github.com/CurtisYoung18/7140-My-event-website", text: "GitHub", icon: "fab fa-github", class: "github" }
                ]
            },
            {
                name: "Green Go",
                category: "Demo Platform",
                description: "A Demo Implementation of an online platform for biking enthusiasts to share their experiences and find routes.",
                image: "/images/products/greengo.png",
                links: [
                    { url: "https://github.com/CurtisYoung18/GreenGo", text: "GitHub", icon: "fab fa-github", class: "github" }
                ]
            }
        ];

        let currentIndex = 0;
        const imageContainer = document.getElementById('imageContainer');
        const productInfo = document.getElementById('productInfo');
        const productName = document.getElementById('productName');
        const productCategory = document.getElementById('productCategory');
        const productDescription = document.getElementById('productDescription');
        const productLinks = document.getElementById('productLinks');
        const prevButton = document.getElementById('prevButton');
        const nextButton = document.getElementById('nextButton');

        function randomRotateY() {
            return Math.floor(Math.random() * 21) - 10;
        }

        function createImageWrappers() {
            products.forEach((product, index) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'product-image-wrapper';
                wrapper.dataset.index = index;
                
                const img = document.createElement('img');
                img.src = product.image;
                img.alt = product.name;
                img.className = 'product-image';
                img.draggable = false;
                
                wrapper.appendChild(img);
                imageContainer.appendChild(wrapper);
            });
        }

        function updateDisplay() {
            // Update images
            const wrappers = document.querySelectorAll('.product-image-wrapper');
            wrappers.forEach((wrapper, index) => {
                wrapper.classList.remove('active', 'prev', 'next');
                if (index === currentIndex) {
                    wrapper.classList.add('active');
                } else if (index < currentIndex) {
                    wrapper.classList.add('prev');
                } else {
                    wrapper.classList.add('next');
                }
            });

            // Update content with animation
            productInfo.classList.remove('active');
            setTimeout(() => {
                const product = products[currentIndex];
                productName.textContent = product.name;
                productCategory.textContent = product.category;
                
                // Animate description word by word
                const words = product.description.split(' ');
                productDescription.innerHTML = '';
                words.forEach((word, index) => {
                    const span = document.createElement('span');
                    span.className = 'product-description-word';
                    span.textContent = word + ' ';
                    productDescription.appendChild(span);
                    setTimeout(() => {
                        span.classList.add('visible');
                    }, index * 20);
                });

                // Update links
                productLinks.innerHTML = '';
                product.links.forEach(link => {
                    const a = document.createElement('a');
                    a.href = link.url;
                    a.target = '_blank';
                    a.className = `product-link ${link.class || ''}`;
                    a.innerHTML = `<i class="${link.icon}"></i> ${link.text}`;
                    productLinks.appendChild(a);
                });

                productInfo.classList.add('active');
            }, 200);
        }

        function nextProduct() {
            currentIndex = (currentIndex + 1) % products.length;
            updateDisplay();
        }

        function prevProduct() {
            currentIndex = (currentIndex - 1 + products.length) % products.length;
            updateDisplay();
        }

        prevButton.addEventListener('click', prevProduct);
        nextButton.addEventListener('click', nextProduct);

        // Initialize
        createImageWrappers();
        updateDisplay();

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') prevProduct();
            if (e.key === 'ArrowRight') nextProduct();
        });
    </script>
    <script type="text/javascript" src="/js/canvas-nest.js" color="0,0,0" opacity="0.3" zindex="-2" count="299"></script>
</body>
</html>
