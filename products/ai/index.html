<!DOCTYPE html>
<html lang="en">
<head>

    <meta http-equiv="X-UA-Compatible" content="ie=edge">

    <meta name="keywords" content="AI, Machine Learning, Projects">
    <title>AI Related Projects | Curtis の Home</title>
    <link rel="icon" href="/favicon.ico">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/mobile.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .animated-products-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 4rem 2rem;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            color: #2c3e50;
            text-decoration: none;
            margin-bottom: 2rem;
            font-size: 1.2rem;
            transition: all 0.3s ease;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.05);
        }

        .back-button:hover {
            transform: translateX(-5px);
            background: rgba(0, 0, 0, 0.1);
        }

        /* Dark mode */
        .dark .back-button {
            color: #ecf0f1;
            background: rgba(255, 255, 255, 0.1);
        }

        .dark .back-button:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .products-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 3rem;
        }

        @media (min-width: 768px) {
            .products-grid {
                grid-template-columns: 1fr 1fr;
                gap: 4rem;
            }
        }

        .products-image-container {
            position: relative;
            height: 400px;
            width: 100%;
        }

        .product-image-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transform: scale(0.9) rotateY(0deg);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1;
        }

        .product-image-wrapper.active {
            opacity: 1;
            transform: scale(1) rotateY(0deg) translateY(0);
            z-index: 10;
        }

        .product-image-wrapper.prev {
            opacity: 0.7;
            transform: scale(0.95) rotateY(-10deg);
            z-index: 2;
        }

        .product-image-wrapper.next {
            opacity: 0.7;
            transform: scale(0.95) rotateY(10deg);
            z-index: 2;
        }

        .product-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .products-content {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 1rem 0;
        }

        .product-info {
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s ease;
        }

        .product-info.active {
            opacity: 1;
            transform: translateY(0);
        }

        .product-name {
            font-size: 2rem;
            font-weight: 700;
            color: #2c3e50;
            margin: 0 0 0.5rem 0;
        }

        .product-category {
            font-size: 0.9rem;
            color: #7f8c8d;
            margin-bottom: 2rem;
        }

        .product-description {
            font-size: 1.1rem;
            color: #34495e;
            line-height: 1.8;
            margin-bottom: 2rem;
            white-space: normal;
        }

        .product-description-word {
            display: inline;
            opacity: 0;
            filter: blur(10px);
            transform: translateY(5px);
            transition: all 0.2s ease;
            white-space: pre;
        }

        .product-description-word.visible {
            opacity: 1;
            filter: blur(0);
            transform: translateY(0);
        }

        .product-controls {
            display: flex;
            gap: 1rem;
            padding-top: 2rem;
        }

        .control-button {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #ecf0f1;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #2c3e50;
        }

        .control-button:hover {
            background: #3498db;
            color: white;
            transform: scale(1.1);
        }

        .control-button:active {
            transform: scale(0.95);
        }

        .product-links {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-top: 2rem;
        }

        .product-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            background: rgba(52, 152, 219, 0.1);
            color: #3498db;
            text-decoration: none;
            border-radius: 25px;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .product-link:hover {
            background: rgba(52, 152, 219, 0.2);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(52, 152, 219, 0.3);
        }

        .product-link.github {
            background: rgba(36, 41, 46, 0.1);
            color: #24292e;
        }

        .product-link.github:hover {
            background: rgba(36, 41, 46, 0.15);
        }

        /* Dark mode */
        .dark .product-name {
            color: #ecf0f1;
        }

        .dark .product-category {
            color: #95a5a6;
        }

        .dark .product-description {
            color: #bdc3c7;
        }

        .dark .control-button {
            background: #34495e;
            color: #ecf0f1;
        }

        .dark .control-button:hover {
            background: #3498db;
        }

        @media (max-width: 767px) {
            .products-grid {
                gap: 2rem;
            }

            .products-image-container {
                height: 300px;
            }

            .product-name {
                font-size: 1.5rem;
            }

            .product-links {
                justify-content: center;
                width: 100%;
            }

            .product-link {
                width: 100%;
                justify-content: center;
                text-align: center;
            }

            .product-controls {
                justify-content: center;
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <header>
            <nav class="navbar">
                <div class="container">
                    <div class="navbar-header header-logo"><a href="/">Curtis の Home</a></div>
                    <div class="menu navbar-right">
                        <a class="menu-item" href="/archives">Posts</a>
                        <a class="menu-item" href="/products">Products</a>
                        <a class="menu-item" href="/collection">Collections</a>
                        <a class="menu-item" href="/about">About</a>
                    </div>
                </div>
            </nav>
        </header>

        <div class="main">
            <div class="container">
                <div class="animated-products-container">
                    <a href="/products/" class="back-button" title="Back to Products">
                        <i class="fas fa-arrow-left"></i>
                    </a>

                    <div class="products-grid">
                        <div class="products-image-container" id="imageContainer"></div>
                        <div class="products-content">
                            <div class="product-info" id="productInfo">
                                <h3 class="product-name" id="productName"></h3>
                                <p class="product-category" id="productCategory"></p>
                                <p class="product-description" id="productDescription"></p>
                                <div class="product-links" id="productLinks"></div>
                            </div>
                            <div class="product-controls">
                                <button class="control-button" id="prevButton">
                                    <i class="fas fa-arrow-left"></i>
                                </button>
                                <button class="control-button" id="nextButton">
                                    <i class="fas fa-arrow-right"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <footer id="footer" class="footer">
            <div class="copyright">
                <span>© Curtis Mei</span>
            </div>
        </footer>
    </div>

    <script>
        const products = [
            {

                    { url: "https://dl.acm.org/doi/10.1145/3696410.3714737", text: "DOI", icon: "fas fa-external-link-alt" }
                ]
            },
            {

                description: "A system that cleans emails using code and LLMs and upload the cleaned emails to the RAG knowledge base for users to chat with.",
                image: "/images/products/eml_process.gif",
                links: [
                    { url: "https://github.com/CurtisYoung18/Eml_process_platform", text: "GitHub", icon: "fab fa-github", class: "github" }
                ]
            },
            {
                name: "Food Poisoning Questionnaire System",
                category: "Function Integration",
                description: "A system that helps nursing team to generate, revise and manage food poisoning questionnaires as well as analyze the data from the questionnaire using chat with LLMs.",
                image: "/images/products/food_posioning.png",
                links: [
                    { url: "https://github.com/CurtisYoung18/v0-poc", text: "GitHub", icon: "fab fa-github", class: "github" },
                    { url: "https://gptbots-poc.vercel.app", text: "Demo", icon: "fas fa-external-link-alt" }
                ]
            },
            {
                name: "Chat & Manage Housing Fund",
                category: "Function Integration",
                description: "A system that allows users to chat with LLMs to manage (query and withdraw) their housing fund.",
                image: "/images/products/gjj.gif",
                links: [
                    { url: "https://github.com/CurtisYoung18/minzheng-tong-demo", text: "GitHub", icon: "fab fa-github", class: "github" },
                    { url: "https://v0-minzheng-tong-demo.vercel.app", text: "Demo", icon: "fas fa-external-link-alt" }
                ]
            },
            {
                name: "Live chat Widget integration for AI Customer Service",
                category: "Function Integration",
                description: "A system that integrates several live chat widgets into an AI customer service system, allowing better interaction between users and the AI.",
                image: "/images/products/widget.gif",
                links: [
                    { url: "https://v0-i-gaming.vercel.app", text: "Demo", icon: "fas fa-external-link-alt" }
                ]
            },
            {
                name: "DQN Implementation",
                category: "Reinforcement Learning",
                description: "Implementation of Deep Q-Network (DQN) beyond Cartpole and Lunar Lander using PyTorch.",
                image: "/images/products/dqn.gif",
                links: [
                    { url: "https://github.com/CurtisYoung18/RL-DQN", text: "GitHub", icon: "fab fa-github", class: "github" }
                ]
            },
            {
                name: "MY_MAP - 智能地图助手",
                category: "AI Agent / MCP",
                description: "AI 驱动的智能地图助手，支持全国路线规划和沿途 POI 推荐。使用自然语言描述出行需求，AI 理解并规划最佳行程，支持途经点、距离、时间和过路费估算，并智能推荐沿途餐厅、咖啡厅、加油站等服务设施。",
                image: "/images/products/my_map.png",
                links: [
                    { url: "https://github.com/CurtisYoung18/MY_MAP", text: "GitHub", icon: "fab fa-github", class: "github" }
                ]
            }
            // {
            //     name: "Text2SQL",
            //     category: "AI Agent",
            //     description: "Text2SQL is a tool that converts natural language queries into SQL statements, allowing users to interact with databases using natural language. In this project, I implemented a Text2SQL agent that can help users to analyze the data (student scores) in the database.",
            //     image: "/images/products/text2sql.png",
            //     links: [
            //         { url: "https://github.com/CurtisYoung18/Text2Sql", text: "GitHub", icon: "fab fa-github", class: "github" },
            //         { url: "https://udify.app/chat/4AP6kVeEusD9RFUC", text: "Demo", icon: "fas fa-external-link-alt" }
            //     ]
            // },
            // {
            //     name: "Map MCP",
            //     category: "Multi-Criteria Decision Making",
            //     description: "A map-based multi-criteria decision-making agent that helps users make decisions based on multiple criteria.",
            //     image: "/images/products/map_mcp.png",
            //     links: [
            //         { url: "https://github.com/CurtisYoung18/Map_MCP", text: "GitHub", icon: "fab fa-github", class: "github" }
            //     ]
            // }
        ];

        let currentIndex = 0;
        const imageContainer = document.getElementById('imageContainer');
        const productInfo = document.getElementById('productInfo');
        const productName = document.getElementById('productName');
        const productCategory = document.getElementById('productCategory');
        const productDescription = document.getElementById('productDescription');
        const productLinks = document.getElementById('productLinks');
        const prevButton = document.getElementById('prevButton');
        const nextButton = document.getElementById('nextButton');

        function randomRotateY() {
            return Math.floor(Math.random() * 21) - 10;
        }

        function createImageWrappers() {
            products.forEach((product, index) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'product-image-wrapper';
                wrapper.dataset.index = index;
                
                const img = document.createElement('img');
                img.src = product.image;
                img.alt = product.name;
                img.className = 'product-image';
                img.draggable = false;
                
                wrapper.appendChild(img);
                imageContainer.appendChild(wrapper);
            });
        }

        function updateDisplay() {
            // Update images
            const wrappers = document.querySelectorAll('.product-image-wrapper');
            wrappers.forEach((wrapper, index) => {
                wrapper.classList.remove('active', 'prev', 'next');
                if (index === currentIndex) {
                    wrapper.classList.add('active');
                } else if (index < currentIndex) {
                    wrapper.classList.add('prev');
                } else {
                    wrapper.classList.add('next');
                }
            });

            // Update content with animation
            productInfo.classList.remove('active');
            setTimeout(() => {
                const product = products[currentIndex];
                productName.textContent = product.name;
                productCategory.textContent = product.category;
                
                // Animate description word by word
                const words = product.description.split(' ');
                productDescription.innerHTML = '';
                words.forEach((word, index) => {
                    const span = document.createElement('span');
                    span.className = 'product-description-word';
                    span.textContent = word;
                    productDescription.appendChild(span);
                    // Add space after each word (except the last one)
                    if (index < words.length - 1) {
                        productDescription.appendChild(document.createTextNode(' '));
                    }
                    setTimeout(() => {
                        span.classList.add('visible');
                    }, index * 20);
                });

                // Update links
                productLinks.innerHTML = '';
                product.links.forEach(link => {
                    const a = document.createElement('a');
                    a.href = link.url;
                    a.target = '_blank';
                    a.className = `product-link ${link.class || ''}`;
                    a.innerHTML = `<i class="${link.icon}"></i> ${link.text}`;
                    productLinks.appendChild(a);
                });

                productInfo.classList.add('active');
            }, 200);
        }

        function nextProduct() {
            currentIndex = (currentIndex + 1) % products.length;
            updateDisplay();
        }

        function prevProduct() {
            currentIndex = (currentIndex - 1 + products.length) % products.length;
            updateDisplay();
        }

        prevButton.addEventListener('click', prevProduct);
        nextButton.addEventListener('click', nextProduct);

        // Initialize
        createImageWrappers();
        updateDisplay();

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') prevProduct();
            if (e.key === 'ArrowRight') nextProduct();
        });
    </script>
    <script type="text/javascript" src="/js/canvas-nest.js" color="0,0,0" opacity="0.3" zindex="-2" count="299"></script>
</body>
