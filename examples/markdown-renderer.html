<body>
    <div class="container">
        <article class="markdown-body" id="markdown-content">
            <!-- Markdown 内容将在这里渲染 -->
        </article>
    </div>

    <script>
        // 配置 marked
        marked.setOptions({
            breaks: true,        // 支持换行
            gfm: true,           // GitHub Flavored Markdown
            headerIds: true,     // 为标题添加 ID
            mangle: false,       // 不混淆邮箱地址
            pedantic: false,
            sanitize: false,     // 不使用内置的 sanitize（我们用 DOMPurify）
            smartLists: true,    // 智能列表
            smartypants: false,
            highlight: function(code, lang) {
                // 使用 highlight.js 高亮代码
                if (lang && hljs.getLanguage(lang)) {
                    try {
                        return hljs.highlight(code, { language: lang }).value;
                    } catch (err) {}
                }
                return hljs.highlightAuto(code).value;
            }
        });

        // 示例 Markdown 内容
        const markdownText = `# Markdown 渲染示例

        // 渲染 Markdown
        function renderMarkdown(markdown) {
            // 解析 Markdown 为 HTML
            const html = marked.parse(markdown);
            
            // 安全过滤（防止 XSS）
            const cleanHtml = DOMPurify.sanitize(html, {
                ALLOWED_TAGS: ['p', 'h1', 'h2', 'h3', 'h4', 'h5', 'h6', 'strong', 'em', 'u', 's', 'code', 'pre', 'blockquote', 'ul', 'ol', 'li', 'table', 'thead', 'tbody', 'tr', 'th', 'td', 'a', 'img', 'hr', 'br', 'span', 'div'],
                ALLOWED_ATTR: ['href', 'src', 'alt', 'title', 'class', 'id', 'target', 'rel']
            });
            
            // 插入到页面
            document.getElementById('markdown-content').innerHTML = cleanHtml;
            
            // 高亮所有代码块（marked 已经处理了，但确保一下）
            document.querySelectorAll('pre code').forEach((block) => {
                hljs.highlightElement(block);
            });
        }

        // 如果要从文件加载 Markdown
        async function loadMarkdownFromFile(url) {
            try {
                const response = await fetch(url);
                const markdown = await response.text();
                renderMarkdown(markdown);
            } catch (error) {
                console.error('加载 Markdown 文件失败:', error);
            }
        }

        // 初始化：渲染示例内容
        renderMarkdown(markdownText);

        // 使用示例：从文件加载
        // loadMarkdownFromFile('/path/to/your/file.md');
    </script>
</body>
